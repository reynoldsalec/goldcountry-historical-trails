[project]
name = "foothill-trail-atlas"
version = "0.0.0"
description = "Temporal GIS dataset and static viewer for historical trail extent in the Sierra Nevada foothills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "click>=8.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.uv]
# This repo is a set of scripts run through the Makefile, not a distributable
# library. Nothing is built or installed from it.
package = false

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
